[package]
name = "lalia"
version = "0.4.0"
edition = "2021"
description = "Lalia — system-wide live dictation for Windows and Linux (X11) with a tray icon and settings window, powered by Gemini 3.5 Transcribe Live"
license = "MIT"
authors = ["Lalia contributors"]

[[bin]]
name = "lalia"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
cpal = "0.18"
base64 = "0.22"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "links"] }
egui-phosphor = "0.14"
tiny-skia = "0.12"
ab_glyph = "0.2"
arboard = { version = "3", default-features = false }

# Linux (X11): OpenGL window, X11 overlay and hotkeys, tray over D-Bus.
[target.'cfg(unix)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "x11"] }
x11rb = { version = "0.13", features = ["randr", "xfixes", "shape"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }

# Windows: Direct3D window (works without OpenGL drivers), Win32 for the rest.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
